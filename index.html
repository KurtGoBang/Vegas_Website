<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Fullscreen Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>THE VEGAS SPOT - NEXUS 2026</title>

    <!-- Google Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --neon-pink: #FF0EBE;
            --neon-purple: #8A00FF;
            --bg-black: #020202;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-green: #00FF88;
            --font-main: 'Space Grotesk', sans-serif;
            --font-brand: 'Russo One', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: var(--font-main);
            color: white;
            width: 100vw;
            height: 100vh;
        }

        body.loading-active, body.card-zoomed {
            overflow: hidden;
        }

        /* --- Header & Branding --- */
        #main-header {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10007;
            transition: top 0.5s ease-out;
        }

        #main-header.menu-hidden {
            top: -100px;
        }

        #header-pill-container {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        #logo {
            font-family: var(--font-brand);
            font-weight: 700;
            font-size: 22px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: baseline;
            gap: 5px;
            color: white;
        }

        .logo-word { color: white; text-decoration: none !important; }
        .logo-vegas {
            background: linear-gradient(90deg, #FF0EBE 0%, #8A00FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- Navigation --- */
        #nav-icon {
            width: 40px;
            height: 30px;
            position: relative;
            cursor: pointer;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 10009;
        }
        #nav-icon span {
            display: block; width: 100%; height: 4px; background: white; border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }
        #nav-icon.open span:nth-child(1) { transform: translateY(13px) rotate(45deg); }
        #nav-icon.open span:nth-child(2) { opacity: 0; }
        #nav-icon.open span:nth-child(3) { transform: translateY(-13px) rotate(-45deg); }

        #nav-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 10008;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 20px; opacity: 0; visibility: hidden; transition: all 0.5s;
        }
        #nav-overlay.open { opacity: 1; visibility: visible; }
        #nav-overlay a { color: white; text-decoration: none; font-size: 32px; font-family: var(--font-brand); text-transform: uppercase; letter-spacing: 2px; }

        /* --- Loading Screen --- */
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 5vw; }
        #loading-text { font-family: var(--font-brand); font-size: 16vw; color: white; line-height: 0.7; text-align: left; }
        #loading-text .word { display: block; opacity: 0; transform: translateX(-100%); transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1.2s ease-out; }
        #loading-text.slide-in .word { opacity: 1; transform: translateX(0); }
        #loading-text.slide-in .word:nth-child(1) { transition-delay: 0.1s; }
        #loading-text.slide-in .word:nth-child(2) { transition-delay: 1.6s; }
        #loading-text.slide-in .word:nth-child(3) { transition-delay: 3.1s; }

        #new-pill-loader-container { position: fixed; top: 40px; right: 40px; width: 25vw; height: 5vw; border: 2px solid white; border-radius: 5vw; overflow: hidden; z-index: 100000; }
        #new-pill-loader-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #FF0EBE, #8A00FF); }
        #new-percentage-counter { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-brand); font-size: 2vw; color: white; }

        #white-slide-overlay { position: fixed; inset: 0; z-index: 10000; transform: translateY(100%); transition: 1.2s cubic-bezier(0.8, 0, 0.2, 1); }
        #white-slide-overlay.slide-up { transform: translateY(0); }
        .overlay-image { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
        #white-slide-overlay.dimmed .overlay-image { filter: grayscale(100%) brightness(0.3) blur(15px); }

        /* --- Grid & Cards --- */
        #card-grid-container { 
            position: fixed; 
            top: 120px; 
            bottom: 0; 
            left: 0;
            width: 100vw;
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            padding-bottom: 250px;
            overflow-y: auto; 
            z-index: 10005;
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.5s, visibility 0.5s; 
            scrollbar-width: none;
        }
        #card-grid-container.visible { opacity: 1; visibility: visible; }
        #card-grid-container::-webkit-scrollbar { display: none; }

        .card { background: #111; border-radius: 16px; cursor: pointer; height: 160px; display: flex; align-items: center; padding: 0 20px; border: 2px solid #333; position: relative; background-size: cover; background-position: center; transition: transform 0.3s, border-color 0.3s; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--neon-pink); }
        .card-text { font-family: var(--font-brand); font-size: 1.5rem; color: white; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.8); position: relative; }
        .card::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); border-radius: 16px; z-index: 1; }

        /* --- Footer Menu --- */
        footer.glassmorphism-menu {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(200%); width: fit-content; min-width: 80%;
            display: flex; align-items: center; justify-content: center; padding: 10px 1.5rem; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            z-index: 10006; transition: 0.8s; opacity: 0;
        }
        footer.glassmorphism-menu.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
        .glass-item { color: white; cursor: pointer; font-family: var(--font-brand); font-size: 0.95rem; padding: 12px 20px; transition: 0.3s; flex-grow: 1; text-align: center; border-radius: 10px; }
        .glass-item--active { background: linear-gradient(90deg, #FF0EBE, #8A00FF) !important; }

        /* --- Nexus Expanded UI --- */
        #animation-clone { position: fixed; inset: 0; visibility: hidden; z-index: 10010; overflow: hidden; background: var(--bg-black); }
        #animation-close-btn { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(0,0,0,0.8); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 10011; opacity: 0; transition: 0.3s; border: 1px solid #444; }
        #animation-close-btn.visible { opacity: 1; }

        .nexus-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--bg-black); }
        
        .visual-terminal { 
            flex: 0 0 45%; 
            max-width: 45%; 
            height: 100%; 
            position: relative; 
            background-size: cover; 
            background-position: center; 
            border-right: 1px solid var(--glass-border); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        .visual-terminal::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,1) 100%); z-index: 1; }
        
        .terminal-overlay { position: relative; z-index: 10; padding: 40px; width: 100%; }
        
        .nexus-badge { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; background: rgba(0,0,0,0.7); border: 1px solid var(--neon-pink); border-radius: 4px; font-family: var(--font-brand); font-size: 14px; letter-spacing: 3px; color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 14, 190, 0.4); backdrop-filter: blur(10px); }
        .pulse-dot { width: 10px; height: 10px; background: var(--neon-pink); border-radius: 50%; animation: pulse-glow 1.5s infinite; }
        @keyframes pulse-glow { 0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 currentColor; } 70% { transform: scale(1.8); opacity: 0; box-shadow: 0 0 0 15px rgba(255,255,255,0); } 100% { transform: scale(1); opacity: 0; } }
        
        .terminal-footer h1 { 
            font-family: var(--font-brand); 
            font-size: 5vw; 
            line-height: 0.85; 
            margin: 0; 
            text-transform: uppercase; 
            color: white; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        .ticker-wrap { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.5); border-top: 1px solid var(--neon-pink); z-index: 20; overflow: hidden; padding: 8px 0; backdrop-filter: blur(5px); }
        .ticker { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 80s linear infinite; font-family: var(--font-brand); font-size: 12px; letter-spacing: 2px; color: white; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .command-dashboard { 
            flex: 0 0 55%; 
            max-width: 55%; 
            height: 100%; 
            overflow-y: scroll; 
            padding: 80px 50px; 
            background: radial-gradient(circle at 70% 20%, #0d0d15 0%, #020202 100%); 
            scrollbar-width: none; 
        }
        .command-dashboard::-webkit-scrollbar { display: none; }
        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 5px; color: #AAA; margin-bottom: 40px; display: flex; align-items: center; gap: 15px; }
        .section-label::after { content: ''; flex-grow: 1; height: 1px; background: #333; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; }
        .stat-card { background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 1px solid var(--glass-border); padding: 25px 15px; border-radius: 16px; text-align: center; }
        .stat-card .val { font-family: var(--font-brand); font-size: 1.8rem; display: block; margin-top: 5px; color: #fff; }
        .stat-card .lab { font-size: 10px; text-transform: uppercase; color: #AAA; }

        .activity-feed { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 25px; margin-bottom: 80px; border: 1px solid var(--glass-border); }
        .feed-item { display: flex; gap: 15px; margin-bottom: 12px; font-size: 13px; border-bottom: 1px solid #222; padding-bottom: 12px; }
        .feed-time { color: var(--neon-pink); font-family: var(--font-brand); }
        .feed-text { color: #EEE; }

        .journey-flow { position: relative; padding-left: 40px; margin-bottom: 100px; }
        .journey-line { position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(to bottom, var(--neon-pink), var(--neon-purple)); }
        .journey-step { position: relative; margin-bottom: 50px; }
        .journey-step::before { content: ''; position: absolute; left: -46px; top: 5px; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px white; border: 3px solid var(--bg-black); }
        .journey-step h3 { margin: 0; font-family: var(--font-brand); font-size: 1.3rem; color: #fff; }
        .journey-step p { margin: 8px 0 0 0; font-size: 1rem; color: #AAA; line-height: 1.5; }

        .package-nexus-card { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; position: relative; margin-bottom: 25px; }
        .package-nexus-card h2 { font-family: var(--font-brand); font-size: 2rem; margin: 0; text-transform: uppercase; color: #fff; }
        .package-price-tag { position: absolute; top: 40px; right: 40px; font-family: var(--font-brand); font-size: 1.5rem; color: var(--accent-green); }
        .package-features { margin: 25px 0 40px 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 12px; }
        .package-features li { font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.1); padding: 8px 18px; border-radius: 50px; color: #FFF; text-transform: uppercase; }
        .nexus-btn { width: 100%; background: linear-gradient(90deg, var(--neon-pink) 0%, var(--neon-purple) 100%); border: none; padding: 22px; border-radius: 14px; color: white; font-family: var(--font-brand); text-transform: uppercase; font-size: 1.1rem; letter-spacing: 3px; cursor: pointer; }

        @media (max-width: 1000px) {
            .nexus-container { flex-direction: column; height: 100vh; overflow-y: scroll; }
            .visual-terminal { flex: 0 0 60vh; max-width: 100%; border-right: none; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
            .command-dashboard { flex: 0 0 auto; max-width: 100%; padding: 40px 20px; overflow-y: visible; }
            .terminal-footer h1 { font-size: 10vw; white-space: normal; word-break: break-word; }
            .stats-grid { grid-template-columns: 1fr; }
            footer.glassmorphism-menu { width: 95%; bottom: 10px; min-width: 95%; padding: 8px; }
            .glass-item { font-size: 0.75rem; padding: 10px 12px; }
            #new-pill-loader-container { width: 40vw; height: 8vw; top: 15px; right: 15px; border-radius: 4vw; }
            #new-percentage-counter { font-size: 3vw; }
            #loading-text { font-size: 18vw; }
        }
    </style>
</head>
<body class="loading-active">

    <div id="loading-screen">
        <div id="loading-text">
            <span class="word">THE</span>
            <span class="word logo-vegas">VEGAS</span>
            <span class="word">SPOT.</span>
        </div>
        <div id="new-pill-loader-container">
            <div id="new-pill-loader-fill"></div>
            <span id="new-percentage-counter">0%</span>
        </div>
    </div>

    <div id="white-slide-overlay">
        <img src="Images/main-page-image.jpg" alt="Hero" class="overlay-image">
    </div>

    <div id="card-grid-container"></div>
    <div id="animation-clone"></div>
    <div id="animation-close-btn">×</div>

    <header id="main-header" class="menu-hidden">
        <div id="header-pill-container">
            <a href="#" id="logo">
                <span class="logo-word">THE</span><span class="logo-word logo-vegas">VEGAS</span><span class="logo-word">SPOT</span>
            </a>
            <div id="nav-icon"><span></span><span></span><span></span></div>
        </div>
    </header>

    <nav id="nav-overlay">
        <a href="#">HOME</a>
        <a href="#">EVENTS</a>
        <a href="#">NIGHTCLUBS</a>
        <a href="#">STRIP CLUBS</a>
    </nav>

    <footer class="glassmorphism-menu">
        <div class="glass-item glass-item--active" data-category="home">Home</div>
        <div class="glass-item" data-category="nightclubs">Nightclubs</div>
        <div class="glass-item" data-category="stripclubs">Strip Clubs</div>
        <div class="glass-item" data-category="partybus">Party Bus</div>
    </footer>

    <script>
        const venueData = {
            nightclubs: {
                stats: { cover: '$60', status: 'PEAK', capacity: '1,500+' },
                journey: [{ h: '01. BOARDING', p: 'VIP Tesla pickup.' }, { h: '02. ENTRY', p: 'Skip line.' }, { h: '03. THE VIBE', p: 'Prime table.' }],
                packages: [{ t: 'VIP PASS', p: '$59', f: ['EXPRESS ENTRY', '2 DRINKS'] }, { t: 'BOTTLE SERVICE', p: '$1,200', f: ['TABLE INCL.', '2 BOTTLES'] }]
            },
            stripclubs: {
                stats: { cover: '$50', status: 'LIVE', capacity: '100+ GIRLS' },
                journey: [{ h: '01. LIMO RUN', p: 'Luxury pickup.' }, { h: '02. FRONT ROW', p: 'No cover.' }, { h: '03. THE SHOW', p: 'Best seats.' }],
                packages: [{ t: 'VIP ENTRY', p: '$49', f: ['LIMO PICKUP', 'NO COVER'] }, { t: 'BOTTLE PARADE', p: '$499', f: ['1 BOTTLE', '8 GUESTS'] }]
            },
            partybus: {
                stats: { rate: '$150/hr', status: 'ON CALL', capacity: '30 GUESTS' },
                journey: [{ h: '01. ROLL CALL', p: 'Pumping bass.' }, { h: '02. STRIP CRUISE', p: 'Vegas sign loop.' }, { h: '03. THE DROP', p: 'VIP arrival.' }],
                packages: [{ t: 'STRIP CRUISE', p: '$299', f: ['2 HOURS', 'ICE & CUPS'] }, { t: 'NIGHT OWL', p: '$799', f: ['6 HOURS', 'OPEN BAR'] }]
            }
        };

        const cardData = {
            nightclubs: [ 
                { name: 'Omnia', img: 'Images/images/omnia.jpg', color: '#FFD700' }, { name: 'XS', img: 'Images/images/XS.jpg', color: '#E6B325' }, 
                { name: 'Zouk', img: 'Images/images/Zouk.jpg', color: '#00F2FF' }, { name: 'LIV', img: 'Images/images/liv.jpg', color: '#00C2FF' },
                { name: 'Drai\'s', img: 'Images/images/drais.jpg', color: '#FF003C' }, { name: 'Hakkasan', img: 'Images/images/hakassan.jpg', color: '#0072FF' }
            ],
            stripclubs: [ 
                { name: 'Peppermint Hippo', img: 'Images/strip-clubs/Hippo-Inside.jpg', color: '#FF00D4' }, { name: 'Treasures', img: 'Images/strip-clubs/Treasures-inside.jpeg', color: '#FACC15' }, 
                { name: 'Sapphire', img: 'Images/strip-clubs/sapphire-inside.jpeg', color: '#0066FF' }, { name: 'Spearmint Rhino', img: 'Images/strip-clubs/spearmint-rhino-inside.jpg', color: '#00FF88' },
                { name: 'Hustler Club', img: 'Images/strip-clubs/Hustlerclub-inside.jpeg', color: '#FF0000' }, { name: 'Crazy Horse 3', img: 'Images/strip-clubs/CrazyHorse-inside.jpeg', color: '#FF8800' }
            ],
            partybus: [ 
                { name: 'Infinity Bus', img: 'https://images.pexels.com/photos/3851065/pexels-photo-3851065.jpeg?auto=compress&cs=tinysrgb&w=1000', color: '#A855F7' }, 
                { name: 'Crown Limo', img: 'https://images.pexels.com/photos/3356848/pexels-photo-3356848.jpeg?auto=compress&cs=tinysrgb&w=1000', color: '#FFD700' },
                { name: 'Good Life Coach', img: 'https://images.pexels.com/photos/1154638/pexels-photo-1154638.jpeg?auto=compress&cs=tinysrgb&w=1000', color: '#F97316' },
                { name: 'Sin City Cruiser', img: 'https://images.pexels.com/photos/2526128/pexels-photo-2526128.jpeg?auto=compress&cs=tinysrgb&w=1000', color: '#EF4444' }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loading-text');
            const mainHeader = document.getElementById('main-header');
            const whiteSlideOverlay = document.getElementById('white-slide-overlay');
            const footerMenu = document.querySelector('footer.glassmorphism-menu');
            const cardGrid = document.getElementById('card-grid-container');
            const animationClone = document.getElementById('animation-clone');
            const closeBtn = document.getElementById('animation-close-btn');
            const navIcon = document.getElementById('nav-icon');
            const navOverlay = document.getElementById('nav-overlay');

            setTimeout(() => loadingText.classList.add('slide-in'), 100);
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 1;
                if (progress >= 100) { progress = 100; clearInterval(progressInterval); }
                document.getElementById('new-pill-loader-fill').style.width = progress + '%';
                document.getElementById('new-percentage-counter').textContent = progress + '%';
            }, 30);

            setTimeout(() => whiteSlideOverlay.classList.add('slide-up'), 4000);
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                mainHeader.classList.remove('menu-hidden');
                footerMenu.classList.add('visible');
            }, 4800);

            navIcon.onclick = () => {
                navIcon.classList.toggle('open');
                navOverlay.classList.toggle('open');
            };

            document.querySelectorAll('.glass-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.glass-item').forEach(i => i.classList.remove('glass-item--active'));
                    item.classList.add('glass-item--active');
                    const cat = item.dataset.category;
                    renderCards(cat);
                    whiteSlideOverlay.classList.toggle('dimmed', cat !== 'home');
                });
            });

            function renderCards(cat) {
                cardGrid.innerHTML = '';
                if (!cardData[cat]) { cardGrid.classList.remove('visible'); return; }
                cardData[cat].forEach(v => {
                    const c = document.createElement('div');
                    c.className = 'card';
                    if (v.img) c.style.backgroundImage = `url("${v.img}")`;
                    c.innerHTML = `<div class="card-text">${v.name}</div>`;
                    c.onclick = () => zoomIn(c, v, cat);
                    cardGrid.appendChild(c);
                });
                cardGrid.classList.add('visible');
                cardGrid.scrollTop = 0;
            }

            function generateTickerText(venue, category) {
                const cities = ["NEW YORK", "LOS ANGELES", "CHICAGO", "MIAMI", "DALLAS", "LONDON", "TORONTO"];
                const city = cities[Math.floor(Math.random() * cities.length)];
                const guests = Math.floor(Math.random() * 100) + 150;
                const time = Math.floor(Math.random() * 10) + 2;
                let t = `+++ ${venue.toUpperCase()} IS VIBING +++ GET IN THE MIX +++ `;
                if (category === 'nightclubs') t += `GUEST FROM ${city} SECURED A TABLE! +++ ${guests} SIGNED UP +++ PEAKING! +++ `;
                else if (category === 'stripclubs') t += `LIMO IS ${time} MINS OUT! +++ 100+ DANCERS LIVE +++ STAGE IS FIRE! +++ `;
                else t += `ONLY 2 SPOTS LEFT FOR 11PM! +++ SQUAD FROM ${city} BOARDED! +++ BASS LOUD! +++ `;
                return t + t;
            }

            function zoomIn(card, data, cat) {
                const rect = card.getBoundingClientRect();
                window.activeCard = card; // Set globally
                const config = venueData[cat];
                const brandColor = data.color || '#FF0EBE';
                const tickerContent = generateTickerText(data.name, cat);
                
                gsap.set(animationClone, { left: rect.left, top: rect.top, width: rect.width, height: rect.height, borderRadius: '16px', visibility: 'visible', overflowY: 'hidden' });
                animationClone.innerHTML = `
                    <div class="nexus-container">
                        <section class="visual-terminal" style="background-image: url('${data.img}')">
                            <div class="terminal-overlay"><div class="nexus-badge" style="border-color: ${brandColor}; color: ${brandColor};"><div class="pulse-dot" style="background: ${brandColor};"></div>VIBE CHECK: LIVE</div></div>
                            <div class="terminal-overlay terminal-footer"><h1 style="white-space: nowrap;">${data.name}</h1></div>
                            <div class="ticker-wrap" style="border-top-color: ${brandColor}; background: ${brandColor}1A;"><div class="ticker" style="color: ${brandColor};">${tickerContent}</div></div>
                        </section>
                        <main class="command-dashboard">
                            <span class="section-label">LIVE STATS</span>
                            <div class="stats-grid">${Object.entries(config.stats).map(([k,v])=>`<div class="stat-card"><span class="lab">${k}</span><span class="val">${v}</span></div>`).join('')}</div>
                            <span class="section-label">THE NIGHT</span>
                            <div class="activity-feed" id="live-feed"><div class="feed-item"><span class="feed-time" style="color: ${brandColor}">NOW</span><span class="feed-text">Ready for launch.</span></div></div>
                            <span class="section-label">THE PLAN</span>
                            <div class="journey-flow"><div class="journey-line" style="background: linear-gradient(to bottom, ${brandColor}, #000);"></div>${config.journey.map(s=>`<div class="journey-step"><h3>${s.h}</h3><p>${s.p}</p></div>`).join('')}</div>
                            <span class="section-label">SECURE YOUR SPOT</span>
                            ${config.packages.map(p=>`<div class="package-nexus-card"><div class="package-price-tag">${p.p}</div><h2>${p.t}</h2><ul class="package-features">${p.f.map(f=>`<li>${f}</li>`).join('')}</ul><button class="nexus-btn" style="background: linear-gradient(90deg, ${brandColor}, #000);">GET IN THE MIX</button></div>`).join('')}
                        </main>
                    </div>
                `;
                gsap.to(animationClone, { duration: 0.6, ease: 'expo.inOut', left: 0, top: 0, width: '100vw', height: '100vh', borderRadius: 0, onComplete: () => {
                    animationClone.style.overflowY = 'auto';
                    closeBtn.classList.add('visible');
                    startLiveFeed(brandColor);
                }});
                card.style.opacity = 0;
            }

            function startLiveFeed(color) {
                const feed = document.getElementById('live-feed');
                const logs = ["Squad arrived.", "Bottles up.", "Vibe check: 100% Fire."];
                window.feedInterval = setInterval(() => {
                    if(!feed) return;
                    const item = document.createElement('div');
                    item.className = 'feed-item';
                    item.innerHTML = `<span class="feed-time" style="color: ${color}">LIVE</span><span class="feed-text">${logs[Math.floor(Math.random()*logs.length)]}</span>`;
                    feed.prepend(item);
                    if(feed.children.length > 5) feed.lastChild.remove();
                }, 8000);
            }

            closeBtn.onclick = () => {
                if(window.feedInterval) clearInterval(window.feedInterval);
                if(!window.activeCard) return;
                const rect = window.activeCard.getBoundingClientRect();
                animationClone.style.overflowY = 'hidden';
                gsap.to(animationClone, { duration: 0.6, ease: 'expo.inOut', left: rect.left, top: rect.top, width: rect.width, height: rect.height, borderRadius: '16px', onComplete: () => {
                    animationClone.style.visibility = 'hidden';
                    window.activeCard.style.opacity = 1;
                    closeBtn.classList.remove('visible');
                }});
            };
        });
    </script>
</body>
</html>
